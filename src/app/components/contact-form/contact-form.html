<form class="contact" [formGroup]="form" (ngSubmit)="submit()" novalidate aria-label="Kontaktformular">
  <label class="field">
    <span>Name</span>
    <input type="text" formControlName="name" autocomplete="name" [attr.aria-invalid]="invalid('name')" />
    @if (invalid('name')) { <small class="field__error">Bitte gib deinen Namen an.</small> }
  </label>
  <label class="field">
    <span>E-Mail</span>
    <input type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="invalid('email')" />
    @if (invalid('email')) { <small class="field__error">Bitte gib eine gültige E-Mail-Adresse an.</small> }
  </label>
  <label class="field">
    <span>Nachricht</span>
    <textarea rows="4" formControlName="message" [attr.aria-invalid]="invalid('message')"></textarea>
    @if (invalid('message')) { <small class="field__error">Die Nachricht braucht mindestens 10 Zeichen.</small> }
  </label>
  <button class="contact__send" type="submit">Nachricht senden</button>
  <p class="contact__notice" role="status">{{ notice() }}</p>
</form>
